# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
#
# Plans — Envio HyperIndex config.
#
# Monad MAINNET indexer config (deploy as a separate Envio indexer with config file config.mainnet.yaml).
# Pots are never listed here: they are registered dynamically from PlansFactory.PotCreated.
name: plans-indexer
description: Plans — group money pots on Monad (pots, ledgers, settle-up graph, corridors, traction stats)

# Entities are per chain (composite key (id, chainId)): mainnet and testnet never mix,
# and GlobalStats/DailyStats are per chain. Filter GraphQL queries by chainId.
disable_default_cross_chain: true
# Addresses are stored lowercase so the app can query with addr.toLowerCase().
address_format: lowercase
# Every handler needs the tx hash (activity feed, links to the explorer). Block number/timestamp are always present.
field_selection:
  transaction_fields:
    - hash

contracts:
  - name: PlansFactory
    abi_file_path: ./abis/PlansFactory.json
    events:
      - event: PotCreated
  - name: Pot
    # No address: registered dynamically by the PotCreated contractRegister handler.
    abi_file_path: ./abis/Pot.json
    events:
      - event: RulesSet
      - event: AllowlistChanged
      - event: MemberJoined
      - event: InviteRotated
      - event: KeyWrapped
      - event: Contributed
      - event: SpendProposed
      - event: Voted
      - event: SpendApproved
      - event: SpendExecuted
      - event: SpendCancelled
      - event: DisputeOpened
      - event: DisputeVoted
      - event: DisputeResolved
      - event: Frozen
      - event: Unfrozen
      - event: RuleChangeProposed
      - event: RuleChangeVoted
      - event: RuleChangeApproved
      - event: RuleChangeApplied
      - event: Acked
      - event: AcksReset
      - event: Pulled
      - event: Payout
      - event: DebtRecorded
      - event: DebtPaid
      - event: MemberExited
      - event: Settled
      # collect(member) after settlement: emitted right after its Payout (same tx); marks that Payout.
      - event: Collected
      - event: EscrowRefunded
  - name: KeyRegistry
    abi_file_path: ./abis/KeyRegistry.json
    events:
      - event: KeyRegistered
  - name: ClaimEscrow
    abi_file_path: ./abis/ClaimEscrow.json
    events:
      - event: ClaimCreated
      - event: Claimed
      - event: ClaimRefunded
  - name: PlansSend
    abi_file_path: ./abis/PlansSend.json
    events:
      - event: Sent
  - name: FxReference
    # Chainlink CRE receiver: reference FX rounds (display / receipts only, never moves funds).
    abi_file_path: ./abis/FxReference.json
    events:
      - event: RoundWritten
      - event: SimulationModeSet
      - event: ProductionModeSet
      - event: MaxMoveSet
      - event: OwnershipTransferStarted
      - event: OwnershipTransferred

chains:
  # Monad mainnet (HyperSync: https://143.hypersync.xyz). Fill in from contracts/deployments/143.json after the
  # mainnet deploy, and set start_block to the deployment block.
  - id: 143
    start_block: 0 # TODO: mainnet deployment block
    contracts:
      - name: PlansFactory
        address: "0x00000000000000000000000000000000000f0001" # TODO after mainnet deploy
      - name: Pot
      - name: KeyRegistry
        address: "0x00000000000000000000000000000000000f0002" # TODO after mainnet deploy
      - name: ClaimEscrow
        address: "0x00000000000000000000000000000000000f0003" # TODO after mainnet deploy
      - name: PlansSend
        address: "0x00000000000000000000000000000000000f0004" # TODO after mainnet deploy
      - name: FxReference
        address: "0x00000000000000000000000000000000000f0005" # TODO after mainnet deploy
