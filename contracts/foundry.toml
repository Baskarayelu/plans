[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = ["forge-std/=lib/forge-std/src/", "solady/=lib/solady/src/"]
# script/Deploy.s.sol writes deployments/<chainid>.json
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 100
fail_on_revert = false

[rpc_endpoints]
monad = "https://rpc.monad.xyz"
monad_testnet = "https://testnet-rpc.monad.xyz"

[etherscan]
monad = { key = "${MONADSCAN_API_KEY}", chain = 143, url = "https://api.etherscan.io/v2/api?chainid=143" }

[lint]
# incorrect-shift misfires on the `1 << memberIndex` bitmaps. Every narrowing cast in src/ was
# reviewed: member indices are < 50, timestamps fit uint40, amounts are range-checked first, and
# casts of caller-supplied values use SafeCastLib. Immutables keep camelCase to match the
# interface getters (ausd(), keyRegistry(), claimEscrow()).
exclude_lints = ["incorrect-shift", "unsafe-typecast", "screaming-snake-case-immutable", "asm-keccak256"]
