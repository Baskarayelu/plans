    <script>
      // Error capture for checks that cannot read the console (Safari WebDriver): every script error,
      // failed resource and console.error since the first byte, in window.__plansErrors.
      (function () {
        var E = (window.__plansErrors = []);
        function push(t, m) { try { if (E.length < 100) E.push({ t: t, m: String(m).slice(0, 300) }); } catch (e) {} }
        window.addEventListener("error", function (e) {
          var el = e && e.target;
          if (el && el !== window && (el.src || el.href)) push("resource", el.src || el.href);
          else push("error", (e && e.message) || "error");
        }, true);
        window.addEventListener("unhandledrejection", function (e) { push("rejection", e && e.reason && (e.reason.message || e.reason)); });
        var ce = console.error;
        console.error = function () { push("console", Array.prototype.map.call(arguments, String).join(" ")); return ce.apply(console, arguments); };
      })();
    </script>
    <script>
      // Plans links (/app/j/<pot>#s=…, /app/v/<pot>#s=…, /app/join#pot=…&s=…, /app/c/1#k=…, /app/claim#k=…,
      // /app/p/<addr>#…) are handled HERE, before the app's router reads the address: the "#" part (which
      // holds the invite secret or claim key) is kept in memory for the app (window.__plansLink, read once
      // by src/lib/domain/webEntry.web.ts) and the history entry is replaced with the app route without it.
      (function () {
        try {
          var B = "/app", l = window.location, h = l.hash || "", r = l.pathname;
          if (r.indexOf(B) !== 0) return;
          r = r.slice(B.length).replace(/\/+$/, "") || "/";
          var f = {}, m, route = null;
          h.replace(/^#/, "").split("&").forEach(function (kv) {
            var i = kv.indexOf("=");
            if (i > 0) { try { f[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1)); } catch (e) {} }
          });
          var qs = function (o) {
            var a = [];
            for (var k in o) if (o[k]) a.push(k + "=" + encodeURIComponent(o[k]));
            return a.length ? "?" + a.join("&") : "";
          };
          if ((m = /^\/(j|v)\/([^/]*)$/.exec(r))) route = "/join" + qs({ pot: m[2].toLowerCase(), n: f.n });
          else if (r === "/join" && h) route = "/join" + qs({ pot: (f.pot || "").toLowerCase(), n: f.n });
          else if (/^\/c\/[^/]*$/.test(r) || (r === "/claim" && h)) route = "/claim" + qs({ n: f.n, m: f.m, a: f.a });
          else if ((m = /^\/p\/([^/]*)$/.exec(r))) route = "/send/amount" + qs({ to: m[1].toLowerCase(), n: f.n, c: f.c, cc: f.cc, cur: f.cur, a: f.a });
          if (!route) return;
          window.__plansLink = { path: r, hash: h };
          window.history.replaceState(null, "", B + route);
        } catch (e) {}
      })();
    </script>
